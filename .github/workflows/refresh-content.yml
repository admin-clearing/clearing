name: Refresh Content

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # also triggerable manually from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new articles
        run: node scripts/fetch-content.mjs
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}   # optional — add in repo Settings > Secrets

      - name: Commit and push if articles were added
        run: |
          git config user.email "clearing-bot@users.noreply.github.com"
          git config user.name  "Clearing Bot"
          git add src/content/articles/
          git diff --staged --quiet || (
            git commit -m "chore: refresh content $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )
